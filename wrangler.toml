name = "overvox"
main = "worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/host/*", "/join/*", "/api/*", "/social"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# v2.9 accounts storage (Workers KV namespace ACCOUNTS, created 28 Nov 2026)
[[kv_namespaces]]
binding = "ACCOUNTS"
id = "e98020f9ff1e4331bd147ca99617533d"
